<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="ViT-AdaLA icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1a2e"/><stop offset="1" stop-color="#120a16"/></linearGradient>
    <linearGradient id="acc" x1="18" y1="56" x2="57" y2="17" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!-- pretrained ViT: image patches, frozen -->
  <g fill="#ffffff" fill-opacity="0.22"><rect x="9" y="9" width="8.5" height="8.5" rx="2.2"/><rect x="20" y="9" width="8.5" height="8.5" rx="2.2"/><rect x="31" y="9" width="8.5" height="8.5" rx="2.2"/><rect x="9" y="20" width="8.5" height="8.5" rx="2.2"/><rect x="20" y="20" width="8.5" height="8.5" rx="2.2"/><rect x="9" y="31" width="8.5" height="8.5" rx="2.2"/></g>
  <!-- slots left behind by the adapted patches -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="2.1 1.7"><rect x="31" y="20" width="8.5" height="8.5" rx="2.2"/><rect x="20" y="31" width="8.5" height="8.5" rx="2.2"/><rect x="31" y="31" width="8.5" height="8.5" rx="2.2"/></g>
  <!-- linear attention: the same patches on one straight line -->
  <path d="M18 56 L57 17" fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/>
  <g fill="url(#acc)" transform="rotate(-45 37.5 36.5)"><rect x="21.5" y="32.25" width="8.5" height="8.5" rx="2.2"/><rect x="33.25" y="32.25" width="8.5" height="8.5" rx="2.2"/><rect x="45" y="32.25" width="8.5" height="8.5" rx="2.2"/></g>
</svg>
